<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catálogo completo de accesorios de escritorio aesthetic en Gopa Tech: teclados, mousepads, auriculares y más." />
  <title>Shop — Gopa Tech</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <img src="img/logo.svg" alt="Gopa Tech" class="logo-imagen" />
      </a>

      <nav class="navbar-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="tienda.html">Shop</a></li>
          <li><a href="contacto.html">Contact</a></li>
        </ul>
      </nav>

      <button class="link-carrito" id="abrir-carrito">
        <span class="cart-emoji" aria-hidden="true">🛍️</span>
        <span class="cart-label">Cart</span>
        <span id="contador-carrito" class="cart-count">(0)</span>
      </button>
    </div>
  </header>

  <!-- PANEL LATERAL DEL CARRITO -->
  <div id="fondo-carrito" class="fondo-carrito"></div>
  <aside id="panel-carrito" class="panel-carrito">
    <div class="panel-carrito-header">
      <h2>Tu Cart 🛍️</h2>
      <button id="cerrar-carrito" class="cerrar-carrito" aria-label="Cerrar carrito">✕</button>
    </div>

    <div id="panel-carrito-items" class="panel-carrito-items">
      <!-- Se llena con JavaScript -->
    </div>

    <div class="panel-carrito-footer">
      <p class="panel-carrito-total">Total: <span id="panel-carrito-total">$0</span></p>
      <a href="carrito.html" class="btn-ver-carrito">View full cart</a>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main>

    <!-- TÍTULO DE LA SECCIÓN -->
    <section class="titulo-pagina">
      <h1>Our Shop</h1>
      <p>Find all our aesthetic products for your setup 🌸</p>
    </section>

    <!-- MENSAJE DE CARGA -->
    <p id="mensaje-carga">Loading products...</p>

    <!-- CATÁLOGO DE PRODUCTOS (se llena con JavaScript) -->
    <section class="catalogo" id="catalogo">
    </section>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <div class="footer-inner">
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="tienda.html">Shop</a></li>
          <li><a href="contacto.html">Contact</a></li>
          <li><a href="carrito.html">Cart</a></li>
        </ul>
      </nav>
      <p>© 2025 Gopa Tech. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
