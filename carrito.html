<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Revisá y editá los productos de tu carrito de compras en Gopa Tech." />
  <title>Cart — Gopa Tech</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <img src="img/logo.svg" alt="Gopa Tech" class="logo-imagen" />
      </a>

      <nav class="navbar-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="tienda.html">Shop</a></li>
          <li><a href="contacto.html">Contact</a></li>
        </ul>
      </nav>

      <button class="link-carrito" id="abrir-carrito">
        <span class="cart-emoji" aria-hidden="true">🛍️</span>
        <span class="cart-label">Cart</span>
        <span id="contador-carrito" class="cart-count">(0)</span>
      </button>
    </div>
  </header>

  <!-- PANEL LATERAL DEL CARRITO -->
  <div id="fondo-carrito" class="fondo-carrito"></div>
  <aside id="panel-carrito" class="panel-carrito">
    <div class="panel-carrito-header">
      <h2>Tu Cart 🛍️</h2>
      <button id="cerrar-carrito" class="cerrar-carrito" aria-label="Cerrar carrito">✕</button>
    </div>

    <div id="panel-carrito-items" class="panel-carrito-items">
      <!-- Se llena con JavaScript -->
    </div>

    <div class="panel-carrito-footer">
      <p class="panel-carrito-total">Total: <span id="panel-carrito-total">$0</span></p>
      <a href="carrito.html" class="btn-ver-carrito">View full cart</a>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main>

    <!-- TÍTULO -->
    <section class="titulo-pagina">
      <h1>Tu Cart de Compras</h1>
      <p>Review, edit and confirm your order 🛍️</p>
    </section>

    <!-- CONTENEDOR DEL CARRITO -->
    <section class="carrito-pagina">

      <div id="lista-carrito" class="lista-carrito">
        <!-- Se llena con JavaScript -->
      </div>

      <div class="resumen-carrito">
        <h3>Summary</h3>
        <p class="resumen-linea">Total: <span id="total-carrito">$0</span></p>
        <button id="finalizar-compra" class="btn-finalizar">Checkout</button>
        <p id="mensaje-compra" class="mensaje-compra"></p>
      </div>

    </section>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <div class="footer-inner">
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="tienda.html">Shop</a></li>
          <li><a href="contacto.html">Contact</a></li>
          <li><a href="carrito.html">Cart</a></li>
        </ul>
      </nav>
      <p>© 2025 Gopa Tech. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
